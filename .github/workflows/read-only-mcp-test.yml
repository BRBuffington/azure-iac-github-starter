# Prove the reference MCP exposes only the approved read-only contract.
name: read-only-mcp-test

on:
  pull_request:
    paths:
      - "examples/read-only-guardrails-mcp/**"
      - ".github/workflows/read-only-mcp-test.yml"
  push:
    branches: [main]
    paths:
      - "examples/read-only-guardrails-mcp/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/read-only-guardrails-mcp/requirements.txt

      - name: Install pinned runtime dependency
        run: python -m pip install -r examples/read-only-guardrails-mcp/requirements.txt

      - name: Compile and run contract tests
        run: |
          set -euo pipefail
          python -m py_compile examples/read-only-guardrails-mcp/server.py
          python -m unittest discover -s examples/read-only-guardrails-mcp/tests -v

      - name: Load with the real MCP SDK
        run: |
          python - <<'PY'
          import asyncio
          import importlib.util
          from pathlib import Path

          path = Path("examples/read-only-guardrails-mcp/server.py")
          spec = importlib.util.spec_from_file_location("guardrails_runtime", path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          manifest = module.guardrails_manifest_get()
          registered = {tool.name for tool in asyncio.run(module.mcp.list_tools())}
          expected = set(module.READ_ONLY_TOOL_NAMES)
          assert manifest["release"]
          assert registered == expected, (registered, expected)
          print(f"Loaded release {manifest['release']} with 8 read-only tools")
          PY