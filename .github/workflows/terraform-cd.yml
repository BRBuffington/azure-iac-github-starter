# CD: plan -> captured artifact -> OPA state-safety gate -> GATED apply.
#
# - push to main  => plan + gate (no apply) by default
# - workflow_dispatch with apply=true => plan + gate + apply (apply runs in a
#   protected GitHub Environment with required reviewers)
#
# The apply job targets the '<env>-apply' GitHub Environment — put your required
# reviewers there so a human approves before any write to live infrastructure.
name: terraform-cd

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "policy/**"
      - ".github/workflows/terraform-cd.yml"
  workflow_dispatch:
    inputs:
      config:
        description: Config (tfvars basename under infra/configs/)
        type: string
        default: example-eus-dev
      apply:
        description: Apply after a clean plan (otherwise plan-only)
        type: boolean
        default: false
      allow_recreate:
        description: Override the OPA destroy/recreate guard (reviewed, intentional only)
        type: boolean
        default: false

concurrency:
  group: tf-cd-${{ github.ref }}-${{ inputs.config || 'example-eus-dev' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ${{ vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-latest' }}
    environment: ${{ vars.PLAN_ENVIRONMENT || 'dev' }}
    defaults:
      run:
        shell: bash
        working-directory: infra
    env:
      CONFIG: ${{ inputs.config || 'example-eus-dev' }}
      DEPLOYED_BY_REPO: ${{ github.repository }}            # provenance: written into common_tags
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}      # least-priv: Reader + state read
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup conftest (OPA)
        run: |
          set -euo pipefail
          VER=0.56.0
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${VER}/conftest_${VER}_Linux_x86_64.tar.gz" | tar -xz -C /tmp conftest
          sudo mv /tmp/conftest /usr/local/bin/conftest

      - name: Compute backend key
        id: bkey
        env:
          KEY_PREFIX: ${{ vars.TF_BACKEND_KEY_PREFIX }}
        run: echo "key=${KEY_PREFIX}/${CONFIG}.tfstate" >> "$GITHUB_OUTPUT"

      - name: OPA gate - backend key convention (pre-plan)
        env:
          BKEY: ${{ steps.bkey.outputs.key }}
        run: |
          set -euo pipefail
          # Value comes from env (not an inline expression in the run body) so a
          # caller-controlled config cannot inject shell.
          printf '{"key": "%s"}' "$BKEY" > /tmp/bkey.json
          conftest test /tmp/bkey.json --policy "${GITHUB_WORKSPACE}/policy" --namespace backend_key --no-color

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ steps.bkey.outputs.key }}" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: terraform plan
        id: plan
        run: |
          set -euo pipefail
          terraform plan -input=false -out="${CONFIG}.tfplan" -var-file="configs/${CONFIG}.tfvars" -var="deployed_by_repo=${DEPLOYED_BY_REPO}" -var="deployed_config=${CONFIG}" -detailed-exitcode || ec=$?
          ec=${ec:-0}
          case "$ec" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::plan failed (exit $ec)"; exit "$ec" ;;
          esac
          terraform show -json "${CONFIG}.tfplan" > "${CONFIG}.tfplan.json"

      - name: OPA gate - state safety + governance (post-plan)
        env:
          # Per-run override comes through env (not an inline expression in the
          # run body) so a caller-controlled input cannot inject shell.
          ALLOW_RECREATE: ${{ inputs.allow_recreate && 'true' || 'false' }}
        run: |
          set -euo pipefail
          # Merge the committed governance config (policy/governance.params.json)
          # with the per-run state-safety flags into ONE file named params.json,
          # so every policy resolves its config from data.params. conftest
          # namespaces a --data file by its basename, so the file MUST be
          # params.json for `data.params.*` to resolve.
          python3 - "$ALLOW_RECREATE" <<'PY'
          import json, sys, os
          gov = json.load(open(os.path.join(os.environ["GITHUB_WORKSPACE"], "policy", "governance.params.json")))
          gov = {k: v for k, v in gov.items() if not k.startswith("//")}
          gov["allow_recreate"] = sys.argv[1] == "true"
          gov["destroy_mode"] = False
          json.dump(gov, open("/tmp/params.json", "w"))
          PY
          # Evaluate both the state-safety (package main) and governance
          # (package governance) namespaces in one pass.
          conftest test "${CONFIG}.tfplan.json" \
            --policy "${GITHUB_WORKSPACE}/policy" \
            --namespace main --namespace governance \
            --data /tmp/params.json --no-color

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.CONFIG }}
          path: |
            infra/${{ env.CONFIG }}.tfplan
            infra/${{ env.CONFIG }}.tfplan.json
          retention-days: 5

  apply:
    needs: plan
    # Apply ONLY on an explicit dispatch with apply=true AND a non-empty plan.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && needs.plan.outputs.has_changes == 'true' }}
    runs-on: ${{ vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-latest' }}
    environment: ${{ vars.PLAN_ENVIRONMENT || 'dev' }}-apply   # required reviewers live here
    defaults:
      run:
        shell: bash
        working-directory: infra
    env:
      CONFIG: ${{ inputs.config || 'example-eus-dev' }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_APPLY_CLIENT_ID }}     # least-priv: scoped write + state write
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.CONFIG }}
          path: infra

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_BACKEND_KEY_PREFIX }}/${CONFIG}.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: terraform apply (the reviewed plan)
        run: terraform apply -input=false "${CONFIG}.tfplan"

      # Stamp LastApplied=<UTC date> on THIS config's resources, in the same
      # already-approved apply job (no second environment gate). Kept OUT of
      # Terraform so it reflects only on apply, never on plan (resources carry
      # ignore_changes = [tags["LastApplied"]]). Resources are found by BOTH the
      # TF-managed DeployedByRepo (= github.repository) and DeployedConfig
      # (= this config) tags, so applying one config never re-stamps another
      # config the same repo owns. No state access is needed; no-op until your
      # resources carry the tags. The apply identity needs tag-write (e.g. Tag
      # Contributor) on the stamped resources.
      - name: Azure login (OIDC, apply identity) for the tag stamp
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Stamp LastApplied on this config's resources
        env:
          # Value via env (not an inline expression in the run body) so nothing
          # is interpolated into the shell. github.repository = DeployedByRepo;
          # CONFIG (job env) = DeployedConfig.
          DEPLOYED_BY_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Azure CLI ships on GitHub-hosted ubuntu runners. Fail closed on a
          # self-hosted runner that lacks it rather than piping an unpinned
          # remote installer into sudo (supply-chain posture for regulated envs).
          if ! command -v az >/dev/null 2>&1; then
            echo "::error::Azure CLI not found. GitHub-hosted ubuntu runners include it; on a self-hosted runner install it first (https://learn.microsoft.com/cli/azure/install-azure-cli)."
            exit 1
          fi
          DATE=$(date -u +%F)
          # Scope by DeployedByRepo (az --tag) AND DeployedConfig (JMESPath).
          # Two discovery calls: `az resource list` returns resources but NOT
          # resource groups, so RGs are listed separately via `az group list`.
          # Capture each discovery into a variable with an EXPLICIT exit-code
          # check: a discovery ERROR (auth, throttle, API failure) FAILS the
          # step, while an empty result stays a clean no-op. A previous `|| true`
          # swallowed real discovery failures, letting the run go green having
          # stamped nothing (az list exits 0 on no-match, non-zero only on error).
          RES_IDS=$(az resource list --tag "DeployedByRepo=${DEPLOYED_BY_REPO}" --query "[?tags.DeployedConfig=='${CONFIG}'].id" -o tsv) || { echo "::error::resource discovery failed (az resource list)"; exit 1; }
          GRP_IDS=$(az group list --tag "DeployedByRepo=${DEPLOYED_BY_REPO}" --query "[?tags.DeployedConfig=='${CONFIG}'].id" -o tsv) || { echo "::error::resource-group discovery failed (az group list)"; exit 1; }
          mapfile -t IDS < <(printf '%s\n%s\n' "$RES_IDS" "$GRP_IDS" | grep -v '^$' || true)
          echo "Stamping LastApplied=$DATE on ${#IDS[@]} resources/groups (DeployedByRepo=${DEPLOYED_BY_REPO}, DeployedConfig=${CONFIG})"
          STAMPED=0
          FAILED=0
          for id in "${IDS[@]}"; do
            [ -z "$id" ] && continue
            # Per-resource guard: an untaggable resource type (or a transient
            # error) must not abort the whole stamp under `set -e`. Failures are
            # surfaced as warning annotations, never silently swallowed.
            if az tag update --resource-id "$id" --operation Merge --tags "LastApplied=$DATE" --only-show-errors >/dev/null 2>&1; then
              echo "  stamped $id"
              STAMPED=$((STAMPED + 1))
            else
              echo "::warning::LastApplied stamp failed for $id (untaggable type, resource lock, or the apply identity lacks Tag Contributor)."
              FAILED=$((FAILED + 1))
            fi
          done
          echo "LastApplied stamp summary: ${STAMPED} stamped, ${FAILED} failed (config=${CONFIG})."
          # Individual failures are tolerated (the infra apply already
          # succeeded), but if there were targets and EVERY stamp failed that is
          # a systemic problem (usually a missing Tag Contributor role) and must
          # fail the step rather than go green having written zero provenance.
          if [ "${FAILED}" -gt 0 ] && [ "${STAMPED}" -eq 0 ]; then
            echo "::error::All ${FAILED} LastApplied stamp(s) failed - the apply identity likely lacks the Tag Contributor role on the target scope."
            exit 1
          fi
