# PR gate: format, validate, IaC security scan, and a speculative plan.
# Runs on every pull request that touches infra/ or a validated reference root. Read-only
# — no apply, no state writes beyond a speculative plan (which the plan identity
# is read-scoped for).
name: terraform-validate

on:
  pull_request:
    paths:
      - "infra/**"
      - "runners/github-hosted-azure-private-networking/**"
      - "examples/cross-tenant-private-link-dns/**"
      - "examples/foundry-agent-teams/**"
      - ".github/scripts/test_foundry_agent_teams_options.py"
      - ".github/scripts/test_private_dns_option_separation.py"
      - "policy/**"
      - ".github/workflows/terraform-*.yml"
      - ".github/workflows/foundry-agent-data-plane.yml"
  workflow_dispatch:

permissions:
  id-token: write   # OIDC to Azure
  contents: read
  pull-requests: write

jobs:
  validate:
    # For a private-endpoint-only landing zone, run this on a SELF-HOSTED runner
    # inside the VNet (see runners/README.md). Example label set shown; swap in
    # 'ubuntu-latest' only while your state account is still publicly reachable.
    runs-on: ${{ vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-latest' }}
    strategy:
      matrix:
        # One entry per config you want validated on PR.
        config: ["example-eus-dev"]
    defaults:
      run:
        shell: bash
        working-directory: infra
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Test independent option roots
        run: python "${GITHUB_WORKSPACE}/.github/scripts/test_private_dns_option_separation.py"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      # Container Apps job runners do not support Docker-in-Docker, so a Docker
      # action such as bridgecrewio/checkov-action cannot run on the recommended
      # private runner. Install the same pinned scanner as a normal Python CLI.
      - name: Install Checkov (pinned)
        run: python -m pip install --disable-pip-version-check checkov==3.3.8

      - name: Test fail-closed Checkov gate
        run: python "${GITHUB_WORKSPACE}/.github/scripts/test_checkov_fail_closed.py"

      - name: IaC security scan (Checkov)
        run: python "${GITHUB_WORKSPACE}/.github/scripts/checkov_fail_closed.py" --directory .

      - name: terraform init (no backend — validate only)
        # A template repo has no remote state to reach. Init without the backend
        # so fmt + validate run on any clone with zero Azure setup. The optional
        # speculative-plan step below re-inits WITH the backend, and only when
        # one is configured.
        run: terraform init -input=false -backend=false

      - name: terraform validate
        run: terraform validate

      # The speculative plan + shift-left governance gate needs the real backend
      # and Azure creds. A template repo has neither, so this whole block is
      # skipped there (fmt + validate + checkov above are the template's gate);
      # it runs for adopters who have configured a backend.
      - name: Setup conftest (OPA)
        if: ${{ vars.TF_BACKEND_STORAGE_ACCOUNT != '' }}
        shell: bash
        run: |
          set -euo pipefail
          VER=0.56.0
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${VER}/conftest_${VER}_Linux_x86_64.tar.gz" | tar -xz -C /tmp conftest
          sudo mv /tmp/conftest /usr/local/bin/conftest

      - name: terraform plan (speculative) + governance gate
        if: ${{ vars.TF_BACKEND_STORAGE_ACCOUNT != '' }}
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=${{ vars.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_BACKEND_KEY_PREFIX }}/${{ matrix.config }}.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"
          terraform plan -input=false -lock=false -out=pr.tfplan -var-file="configs/${{ matrix.config }}.tfvars" -var="deployed_by_repo=${{ github.repository }}" -var="deployed_config=${{ matrix.config }}"
          terraform show -json pr.tfplan > pr.tfplan.json
          # Shift-left: run the governance guardrails on the PR plan so violations
          # surface in review, not at apply. State-safety (package main) is
          # enforced in CD; here we evaluate governance with allow_recreate off.
          python3 - <<'PY'
          import json, os
          gov = json.load(open(os.path.join(os.environ["GITHUB_WORKSPACE"], "policy", "governance.params.json")))
          gov = {k: v for k, v in gov.items() if not k.startswith("//")}
          json.dump(gov, open("/tmp/params.json", "w"))
          PY
          conftest test pr.tfplan.json \
            --policy "${GITHUB_WORKSPACE}/policy" \
            --namespace governance \
            --data /tmp/params.json --no-color

  validate-cross-tenant-private-link-dns-option:
    name: validate-${{ matrix.option }}
    runs-on: ${{ vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        option:
          - standard-contexts
          - prefixed-backing
          - hub-canonical-zones
          - hub-canonical-zones/sample-networks
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: terraform fmt -check
        run: terraform fmt -check -recursive
        working-directory: examples/cross-tenant-private-link-dns/${{ matrix.option }}

      - name: Install Checkov (pinned)
        run: python -m pip install --disable-pip-version-check checkov==3.3.8

      - name: Test fail-closed Checkov gate
        run: python "${GITHUB_WORKSPACE}/.github/scripts/test_checkov_fail_closed.py"

      - name: IaC security scan (Checkov)
        run: python "${GITHUB_WORKSPACE}/.github/scripts/checkov_fail_closed.py" --directory "${GITHUB_WORKSPACE}/examples/cross-tenant-private-link-dns/${{ matrix.option }}"

      - name: terraform init (no backend)
        run: terraform init -input=false -backend=false
        working-directory: examples/cross-tenant-private-link-dns/${{ matrix.option }}

      - name: terraform validate
        run: terraform validate
        working-directory: examples/cross-tenant-private-link-dns/${{ matrix.option }}

      - name: terraform test (mock providers; no Azure calls)
        run: terraform test -no-color
        working-directory: examples/cross-tenant-private-link-dns/${{ matrix.option }}

  validate-github-hosted-apn-runner:
    name: validate-github-hosted-apn-runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: runners/github-hosted-azure-private-networking
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: Install Checkov (pinned)
        run: python -m pip install --disable-pip-version-check checkov==3.3.8

      - name: Test fail-closed Checkov gate
        run: python "${GITHUB_WORKSPACE}/.github/scripts/test_checkov_fail_closed.py"

      - name: IaC security scan (Checkov)
        run: >-
          python "${GITHUB_WORKSPACE}/.github/scripts/checkov_fail_closed.py"
          --directory "${GITHUB_WORKSPACE}/runners/github-hosted-azure-private-networking"

      - name: terraform init (no backend)
        run: terraform init -input=false -backend=false

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform test (mock providers; no Azure or GitHub calls)
        run: terraform test -no-color

      - name: Test GitHub network REST bridge
        shell: pwsh
        run: ./tests/sync-github-network.tests.ps1

  validate-foundry-agent-teams-option:
    name: validate-foundry-${{ matrix.option }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        option:
          - public
          - standard-private-byor
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Test independent Foundry roots and data-plane contracts
        run: python "${GITHUB_WORKSPACE}/.github/scripts/test_foundry_agent_teams_options.py"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive
        working-directory: examples/foundry-agent-teams/${{ matrix.option }}

      - name: Install Checkov (pinned)
        run: python -m pip install --disable-pip-version-check checkov==3.3.8

      - name: Test fail-closed Checkov gate
        run: python "${GITHUB_WORKSPACE}/.github/scripts/test_checkov_fail_closed.py"

      - name: IaC security scan (Checkov)
        run: python "${GITHUB_WORKSPACE}/.github/scripts/checkov_fail_closed.py" --directory "${GITHUB_WORKSPACE}/examples/foundry-agent-teams/${{ matrix.option }}"

      - name: terraform init (no backend)
        run: terraform init -input=false -backend=false
        working-directory: examples/foundry-agent-teams/${{ matrix.option }}

      - name: terraform validate
        run: terraform validate -no-color
        working-directory: examples/foundry-agent-teams/${{ matrix.option }}

      - name: terraform test (root contracts; no Azure calls)
        run: terraform test -no-color
        working-directory: examples/foundry-agent-teams/${{ matrix.option }}

  validate-foundry-agent-teams-bicep:
    name: validate-foundry-standard-private-bicep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Bicep CLI
        shell: bash
        run: az bicep install --version v0.46.1

      - name: Compile Bicep roots and parameters
        shell: bash
        working-directory: examples/foundry-agent-teams/standard-private-bicep
        env:
          AZURE_BICEP_CHECK_VERSION: "false"
        run: |
          set -euo pipefail
          az bicep build --file foundation/main.bicep --stdout >/dev/null
          az bicep build-params --file foundation/main.bicepparam --stdout >/dev/null
          az bicep build --file network/foundry-private-agent.bicep --stdout >/dev/null
          az bicep build-params --file network/foundry-private-agent.bicepparam --stdout >/dev/null
          az bicep build --file bot-service.bicep --stdout >/dev/null
          az bicep build-params --file bot-service.bicepparam --stdout >/dev/null

      - name: Test Bicep publication and diagnostic contracts
        run: python3 .github/scripts/test_foundry_agent_teams_bicep.py

      - name: Test Bicep CIDR diagnostic behavior
        shell: pwsh
        run: ./.github/scripts/test_foundry_agent_teams_bicep.ps1

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem examples/foundry-agent-teams/standard-private-bicep/scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
